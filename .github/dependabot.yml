# Dependabot: abre un pull request contra develop cuando una dependencia tiene version nueva o una vulnerabilidad
# conocida. Su configuracion se lee desde main: un cambio aqui aplica cuando llega a main.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
