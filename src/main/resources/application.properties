spring.application.name=ecomers-api

# ============================================================
# SECRETOS (fuera del control de versiones)
# Se resuelven, en orden de prioridad:
#   1. Variables de entorno (produccion / Docker)
#   2. ./secrets.properties (desarrollo; NO se versiona)
# Sin las claves de BD la app NO arranca (fail-closed).
# Plantilla: secrets.properties.example
# ============================================================
spring.config.import=optional:file:./secrets.properties

# ============================================================
# BASE DE DATOS: tres usuarios de minimo privilegio, un pool cada uno.
# NUNCA se usa el usuario duenio ECOMERS.
#   cliente     -> PKG_CARRITO, PKG_PEDIDO, V_PRECIO_VIGENTE   (tienda)
#   empleado    -> PKG_INVENTARIO y las 10 vistas               (backoffice)
#   integracion -> PKG_PAGO, PKG_COLA, PEDIDO, PEDIDO_ITEM      (webhook y cola)
# ============================================================
app.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost:1521}/${DB_SERVICE:XEPDB1}
app.datasource.connection-timeout=${DB_CONNECTION_TIMEOUT:5s}

app.datasource.cliente.username=${DB_CLIENTE_USERNAME:ECOMERS_CLIENTE_APP}
app.datasource.cliente.password=${DB_CLIENTE_PASSWORD}
app.datasource.cliente.maximum-pool-size=${DB_CLIENTE_POOL_SIZE:10}
app.datasource.cliente.minimum-idle=${DB_CLIENTE_MIN_IDLE:2}

app.datasource.empleado.username=${DB_EMPLEADO_USERNAME:ECOMERS_EMPLEADO_APP}
app.datasource.empleado.password=${DB_EMPLEADO_PASSWORD}
app.datasource.empleado.maximum-pool-size=${DB_EMPLEADO_POOL_SIZE:5}
app.datasource.empleado.minimum-idle=${DB_EMPLEADO_MIN_IDLE:1}

app.datasource.integracion.username=${DB_INTEGRACION_USERNAME:ECOMERS_INTEGRACION_APP}
app.datasource.integracion.password=${DB_INTEGRACION_PASSWORD}
app.datasource.integracion.maximum-pool-size=${DB_INTEGRACION_POOL_SIZE:5}
app.datasource.integracion.minimum-idle=${DB_INTEGRACION_MIN_IDLE:1}

# ============================================================
# SEGURIDAD: login propio. La API emite los JWT (HS256) y guarda el hash BCrypt en Oracle.
# El token trae:
#   - sub: el correo del usuario
#   - rol: CLIENTE o EMPLEADO
#   - id_cliente (solo los clientes): su ID_CLIENTE en la tabla CLIENTE
# JWT_SECRET es obligatorio (minimo 32 caracteres): sin el la app NO arranca (fail-closed).
# ============================================================
app.jwt.secret=${JWT_SECRET}
# Vida del token: 2 horas. Corta a proposito: la lista de revocacion (logout, cambio de contrasena, permisos quitados)
# vive en memoria y se pierde al reiniciar; un token corto acota cuanto puede servir uno revocado.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
app.jwt.issuer=${JWT_ISSUER:ecomers-api}

# CORS: origenes del frontend, separados por coma
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}

# Detras de un proxy o balanceador (Nginx, Traefik, nube): FORWARD_HEADERS_STRATEGY=native hace que la API lea la IP real
# del cliente en X-Forwarded-For, confiando solo en proxies de red interna. Sin proxy delante se deja en none: si no, un
# cliente podria inventar su IP y saltarse el limite de solicitudes.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Rate limiting por IP (ventana fija de 1 minuto) para /api/** (el webhook queda fuera)
app.rate-limit.solicitudes-por-minuto=${RATE_LIMIT_POR_MINUTO:120}
# Mas estricto para /api/v1/auth/** (registro y login): frena la fuerza bruta de credenciales
app.rate-limit.auth-por-minuto=${RATE_LIMIT_AUTH_POR_MINUTO:10}

# ============================================================
# WOMPI (pasarela). Opcional para arrancar: sin estas claves el pago responde
# 503 y el webhook rechaza todo (no se aceptan eventos sin verificar la firma).
# ============================================================
app.wompi.public-key=${WOMPI_PUBLIC_KEY:}
app.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
app.wompi.events-secret=${WOMPI_EVENTS_SECRET:}
app.wompi.checkout-url=${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
app.wompi.redirect-url=${WOMPI_REDIRECT_URL:http://localhost:5173/pedidos/{idPedido}/resultado}

# ============================================================
# IMAGENES DE PRODUCTO (Supabase Storage). Opcional para arrancar: sin estas claves la API
# responde 503 al pedir una subida y rechaza cualquier URL de imagen. El navegador sube el
# archivo DIRECTO a Supabase con una URL firmada que entrega la API. SUPABASE_SERVICE_KEY es un
# secreto (solo servidor, nunca en el frontend). El bucket debe ser PUBLICO (para mostrar las fotos).
# ============================================================
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.supabase.bucket=${SUPABASE_BUCKET:productos}

# ============================================================
# COLA (consumidores de ENVIAR_CORREO y SINCRONIZAR_ERP)
# ============================================================
app.cola.habilitada=${COLA_HABILITADA:true}
app.cola.intervalo-ms=${COLA_INTERVALO_MS:10000}
app.cola.tamano-lote=${COLA_TAMANO_LOTE:10}
app.erp.modo=${ERP_MODO:simulado}

# ============================================================
# CORREO (SMTP). En desarrollo: Mailpit de docker-compose.
# ============================================================
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
# Tiempos de espera (ms): sin ellos, un SMTP que no responde deja colgado el hilo de la cola para siempre.
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECT_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_TIMEOUT_MS:10000}
app.correo.remitente=${CORREO_REMITENTE:tienda@ecomers.test}

# ============================================================
# CACHE del catalogo publico (servidor + navegador)
# ============================================================
app.cache.catalogo-ttl-seg=${CACHE_CATALOGO_TTL_SEG:60}
app.cache.http-max-age-seg=${CACHE_HTTP_MAX_AGE_SEG:60}

# ============================================================
# ACTUATOR: health publico; el detalle por pool solo para EMPLEADO
# ============================================================
management.endpoints.web.exposure.include=health,info
# Si el SMTP cae, la cola reintenta el correo: no es motivo para sacar la API de servicio.
management.health.mail.enabled=${HEALTH_CORREO_HABILITADO:false}
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=EMPLEADO

# ============================================================
# DOCUMENTACION (OpenAPI). Apagada por defecto: en desarrollo se enciende con API_DOCS_HABILITADO=true
# ============================================================
springdoc.api-docs.enabled=${API_DOCS_HABILITADO:false}
springdoc.swagger-ui.enabled=${API_DOCS_HABILITADO:false}
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# SERVIDOR Y ERRORES (nunca exponer la traza)
# ============================================================
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.web.error.include-stacktrace=never
